<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-labelledby="title desc">
  <title id="title">Typing profile tagline</title>
  <desc id="desc">A looping terminal-style typing line: founder, product builder, data storyteller.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B99AFF"/><stop offset=".55" stop-color="#FF9DB8"/><stop offset="1" stop-color="#86E6D1"/></linearGradient>
    <clipPath id="typed"><rect x="183" y="0" width="0" height="570"><animate attributeName="width" values="0;430;430;0;0" keyTimes="0;.38;.69;.96;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="86" rx="19" fill="#151326" stroke="#B99AFF" stroke-opacity=".28"/>
  <circle cx="31" cy="30" r="5" fill="#FF9DB8"/><circle cx="49" cy="30" r="5" fill="#F4D477"/><circle cx="67" cy="30" r="5" fill="#86E6D1"/>
  <text x="91" y="35" fill="#8F85A9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">iqra@github ~</text>
  <text x="91" y="62" fill="#86E6D1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">$</text>
  <text x="116" y="62" fill="#C9A7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">echo</text>
  <text x="170" y="62" fill="#EAE4F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">"</text>
  <g clip-path="url(#typed)">
    <text x="183" y="62" fill="#F5ECFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Founder · product builder · data storyteller</text>
  </g>
  <rect x="183" y="45" width="2" height="22" rx="1" fill="#FF9DB8">
    <animate attributeName="x" values="183;613;613;183;183" keyTimes="0;.38;.69;.96;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.69;.76;.84;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <path d="M923 30h1v28h-1z" fill="url(#edge)" opacity=".35"/>
  <text x="951" y="48" fill="#9F93B9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.2">READY TO BUILD</text>
  <circle cx="1144" cy="44" r="5" fill="#86E6D1"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
