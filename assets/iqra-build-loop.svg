<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="title desc">
  <title id="title">From idea to launch</title>
  <desc id="desc">A looping animated path through five stages: idea, strategy, design, build, and launch.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B99AFF"/><stop offset=".5" stop-color="#FF9DB8"/><stop offset="1" stop-color="#86E6D1"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19152B"/><stop offset="1" stop-color="#121B29"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="158" rx="22" fill="url(#panel)" stroke="#B99AFF" stroke-opacity=".25"/>
  <text x="600" y="27" text-anchor="middle" fill="#988EAF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2">THE WILL &amp; WAY BUILD LOOP</text>
  <path d="M180 82 H1020" fill="none" stroke="#D6C9F3" stroke-opacity=".18" stroke-width="2"/>
  <path d="M180 82 H1020" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 11">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite"/>
  </path>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" letter-spacing="1">
    <g><rect x="45" y="54" width="190" height="58" rx="15" fill="#201A34" stroke="#B99AFF" stroke-opacity=".6"/><circle cx="70" cy="83" r="7" fill="#B99AFF"/><circle cx="70" cy="83" r="7" fill="#B99AFF" opacity=".3"><animate attributeName="r" values="7;18;7" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="3s" repeatCount="indefinite"/></circle><text x="91" y="88" fill="#F4EEFF" font-size="13">IDEA</text><text x="91" y="101" fill="#9D92B8" font-size="8" font-weight="400" letter-spacing=".6">ASK WHY</text></g>
    <g><rect x="287" y="54" width="190" height="58" rx="15" fill="#201A34" stroke="#B99AFF" stroke-opacity=".6"/><circle cx="312" cy="83" r="7" fill="#C39EFF"/><text x="333" y="88" fill="#F4EEFF" font-size="13">STRATEGY</text><text x="333" y="101" fill="#9D92B8" font-size="8" font-weight="400" letter-spacing=".6">FIND THE SIGNAL</text><circle cx="312" cy="83" r="7" fill="#C39EFF" opacity=".3"><animate attributeName="r" values="7;18;7" dur="3s" begin=".6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="3s" begin=".6s" repeatCount="indefinite"/></circle></g>
    <g><rect x="529" y="54" width="190" height="58" rx="15" fill="#201A34" stroke="#F09FCA" stroke-opacity=".6"/><circle cx="554" cy="83" r="7" fill="#F09FCA"/><text x="575" y="88" fill="#F4EEFF" font-size="13">DESIGN</text><text x="575" y="101" fill="#9D92B8" font-size="8" font-weight="400" letter-spacing=".6">MAKE IT HUMAN</text><circle cx="554" cy="83" r="7" fill="#F09FCA" opacity=".3"><animate attributeName="r" values="7;18;7" dur="3s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle></g>
    <g><rect x="771" y="54" width="190" height="58" rx="15" fill="#201A34" stroke="#E7A0BD" stroke-opacity=".6"/><circle cx="796" cy="83" r="7" fill="#E7A0BD"/><text x="817" y="88" fill="#F4EEFF" font-size="13">BUILD</text><text x="817" y="101" fill="#9D92B8" font-size="8" font-weight="400" letter-spacing=".6">SHIP WITH CARE</text><circle cx="796" cy="83" r="7" fill="#E7A0BD" opacity=".3"><animate attributeName="r" values="7;18;7" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle></g>
    <g><rect x="1013" y="54" width="142" height="58" rx="15" fill="#201A34" stroke="#86E6D1" stroke-opacity=".7"/><circle cx="1038" cy="83" r="7" fill="#86E6D1"/><text x="1059" y="88" fill="#F4EEFF" font-size="12">LAUNCH</text><text x="1059" y="101" fill="#9D92B8" font-size="8" font-weight="400" letter-spacing=".6">LEARN · ITERATE</text><circle cx="1038" cy="83" r="7" fill="#86E6D1" opacity=".3"><animate attributeName="r" values="7;18;7" dur="3s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;0;.4" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
